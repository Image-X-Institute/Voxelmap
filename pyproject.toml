[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelmap"
version = "0.1.0"
description = "Projection-driven respiratory motion estimation from an acquired reference volume"
readme = "README.md"
license = { file = "LICENSE" }  # see NOTICE for patent reservation
requires-python = ">=3.9"
authors = [{ name = "Nick Hindley" }]
keywords = ["CBCT", "deformable registration", "respiratory motion", "2D-3D", "image-guided intervention"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.21",
    "torch>=1.13",
]

# ASTRA (the cone-beam projector) is conda-installable only; see README.

[tool.setuptools.packages.find]
include = ["voxelmap*"]
